[platformio]
src_dir = examples/demo
default_envs=nanoatmega328
;default_envs=esp32
;default_envs=raspberrypi_pico

[env]
lib_deps = adafruit/Adafruit PWM Servo Driver Library@^3.0.3
	   adafruit/Adafruit BusIO@^1.16.2
	   JLed=symlink://./../jled
build_flags = -Isrc

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
; the esp32dev board uses the generic "esp32" pin variant, which does not
; define LED_BUILTIN (unlike specific dev-kit variants); GPIO2 is the
; onboard LED on most ESP32 DevKit boards.
build_flags = ${env.build_flags} -DLED_BUILTIN=2

[env:raspberrypi_pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#v1.4.0-gcc14-arduinopico460
board = rpipico
framework = arduino
board_build.filesystem_size = 0.5m
board_build.core = earlephilhower
upload_protocol = picotool
monitor_dtr = 1

[env:nanoatmega328]
platform = atmelavr
framework = arduino
board = nanoatmega328
monitor_speed = 115200
;build_type = debug
